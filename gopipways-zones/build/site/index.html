elling pressure, and then falls."], [74.09, 76.95, "It's usually easy to spot on a chart."], [77.0, 78.6, "Look at this example."], [78.65, 81.61, "Price reaches this level once, twice, and"], [81.66, 84.84, "three times, and falls each time."], [84.89, 86.73, "That's a resistance level."], [86.78, 90.92, "Whenever price reaches that area, it has been rejected."], [90.97, 93.22, "Support is the opposite."], [93.27, 98.09, "It's an area where price repeatedly comes down and then moves upward."], [98.14, 102.13, "Buyers are stepping in and trying to push price higher."], [102.18, 106.38, "That's the basic concept of support and resistance."], [106.43, 109.56, "So how do we spot these levels?"], [109.61, 112.21, "We look for a price area that has been respected"], [112.26, 116.7, "more than once, where price has reacted and moved away."], [116.75, 120.26, "If it has held two or three times, traders may watch"], [120.31, 124.29, "it for another reaction on the third or fourth test."], [124.34, 128.71, "But how do we improve the probability of choosing a useful level?"], [128.76, 131.69, "That's what we're going to explore in detail."], [131.74, 134.41, "Suppose I mark a resistance level because price"], [134.46, 137.2, "has reached it three times and fallen."], [137.25, 141.62, "What guarantees that price will fall again on the fourth test?"], [141.67, 142.76, "Nothing."], [142.81, 146.49, "Price could break above the resistance and keep moving higher."], [146.54, 149.6, "That's exactly what we need to understand."], [149.65, 152.79, "Now, here's the second basic concept."], [152.84, 157.45, "When price breaks resistance, that former resistance can become support."], [157.5, 163.45, "And when price breaks support, that former support can become resistance."], [163.5, 168.2, "Let's say price repeatedly holds a support level and moves upward."], [168.25, 171.04, "Eventually, that support breaks."], [171.09, 172.83, "If price comes back to the same"], [172.88, 176.64, "level, it may start acting as resistance."], [176.69, 177.68, "Look at this example."], [177.73, 181.21, "What used to be resistance has become support."], [181.26, 184.31, "Price has returned to that area, and we can"], [184.36, 187.15, "watch to see whether buyers defend it again."], [187.2, 189.71, "Now let's look at the opposite."], [189.76, 194.81, "This level acted as support twice, but price eventually broke below it."], [194.86, 200.12, "When price returned to the same area, it met resistance and fell."], [200.17, 202.48, "The former support had become resistance."], [202.54, 206.44, "These are two very basic concepts."], [206.49, 211.26, "If you want to master zone marking, you need to understand them."], [211.31, 215.63, "But why does a broken support sometimes turn into resistance?"], [215.68, 218.67, "What's the logic behind it?"], [218.72, 221.07, "Let's imagine I'm a buyer."], [221.12, 225.98, "I've bought around 4,400 before, and price has gone up each time."], [226.03, 230.14, "I bought once at 4,400 and made a profit."], [230.19, 235.1, "I bought a second time and made a profit again."], [235.15, 238.93, "On the third visit, I think, “This is support."], [238.98, 240.57, "It has worked before."], [240.62, 242.53, "I'll buy at 4,400 again.”"], [242.58, 245.66, "But this time, price breaks lower, and"], [245.71, 248.93, "my position goes into a loss."], [248.98, 253.08, "When price finally returns to 4,400, what might I do?"], [253.13, 256.81, "I may think, “I was stuck in that losing buy."], [256.86, 260.2, "Now that price is back at my entry, I'm getting out.”"], [260.25, 266.3, "That selling pressure can help turn the old support into resistance."], [266.35, 268.25, "It's a simple way to understand one of"], [268.3, 272.78, "the psychological reasons behind the support-to-resistance flip."], [272.83, 277.34, "The reverse can happen when resistance becomes support."], [277.39, 281.46, "Imagine price has repeatedly fallen from 5,600."], [281.51, 285.93, "You've been buying around 5,300 and selling around 5,600."], [285.98, 290.29, "It worked several times."], [290.34, 294.39, "Then you sell again at 5,600, expecting another drop."], [294.44, 299.27, "But instead, price breaks above the resistance."], [299.32, 303.1, "When price returns to 5,600, your thinking may change."], [303.15, 306.45, "You might decide, “That resistance has broken."], [306.5, 309.93, "There may be a better chance of price rising from here.”"], [309.98, 314.53, "So instead of selling, you look for a buy."], [314.58, 317.67, "The area you once treated as resistance is now"], [317.72, 320.99, "an area where you might look for support."], [321.04, 326.6, "That's how trader behavior and market psychology can contribute to these reactions."], [326.65, 331.9, "Of course, there are more technical factors and more advanced mechanisms involved."], [331.95, 334.44, "But this is an easy way to understand why"], [334.49, 339.38, "support can become resistance, and resistance can become support."], [339.43, 340.91, "I hope that's clear."], [340.96, 343.37, "This is the basic foundation."], [343.42, 346.96, "Now we're going to start marking zones more precisely."], [347.01, 350.6, "So far, we've established that support and resistance are"], [350.65, 354.57, "areas where price has reacted two or three times."], [354.62, 359.39, "But that is where many traders stop, and that's a mistake."], [359.44, 361.54, "When you're marking a zone, I want you"], [361.59, 365.07, "to keep two important questions in mind."], [365.12, 369.1, "First, did price move away from the zone with strength?"], [369.15, 372.63, "Was there a strong reaction or a meaningful move?"], [372.68, 375.55, "Second, when price moved away from the zone,"], [375.6, 379.15, "did it create a break of structure?"], [379.2, 382.78, "I'll explain both concepts with an example."], [382.83, 384.36, "Look at this chart."], [384.41, 386.55, "Here we have a potential support level."], [386.6, 390.56, "Price has touched the area twice and moved higher."], [390.61, 393.1, "Many beginners would say, “Two touches?"], [393.15, 394.58, "That's support."], [394.63, 395.53, "Done.”"], [395.58, 397.76, "But that isn't enough."], [397.81, 402.67, "Ask yourself: Did a strong bullish move begin there?"], [402.72, 405.6, "Support and resistance help us identify areas"], [405.65, 409.07, "where buying and selling pressure may exist."], [409.12, 410.88, "But it's not enough just to know"], [410.93, 413.36, "that buyers or sellers are present."], [413.41, 414.61, "We want to know whether they are"], [414.66, 418.26, "strong enough to move price significantly."], [418.31, 422.88, "If buyers are present but weak, the support can still break."], [422.93, 426.84, "If buying pressure is strong, price may move sharply higher."], [426.88, 430.14, "That strength is what interests us."], [430.19, 435.56, "In this example, price reacted from support with a strong upward move."], [435.61, 437.87, "That's our first positive sign."], [437.92, 440.58, "Now, what about a break of structure?"], [440.62, 443.85, "Did price move above a previous significant"], [443.9, 446.63, "high and create a fresh higher high?"], [446.68, 447.6, "Yes."], [447.65, 449.66, "It continued the uptrend and reached a"], [449.71, 452.46, "level it had not reached before."], [452.51, 456.48, "That's what I'm referring to here as a bullish break of structure."], [456.54, 459.73, "If price had bounced a little and then fallen"], [459.78, 463.43, "straight back, we wouldn't have the same confirmation."], [463.48, 468.09, "But in this example, the move from support broke a previous high."], [468.14, 470.3, "So we have both things: a strong"], [470.35, 472.98, "reaction and a break of structure."], [473.04, 477.44, "Now we wait for price to return to that support zone."], [477.49, 480.97, "Here comes price, back into the zone."], [481.02, 483.11, "Suppose it prints a green candle."], [483.16, 487.51, "That gives me an entry confirmation to consider a buy."], [487.56, 489.79, "I could place the stop loss below the support"], [489.84, 493.29, "zone and set a target near the previous high."], [493.34, 496.37, "If price has already broken structure to the upside from"], [496.42, 500.41, "this area, it may be capable of another strong move."], [500.46, 503.29, "That's the idea behind this setup."], [503.34, 505.95, "Let's say my target is 4,500."], [506.0, 507.34, "I enter the buy."], [507.39, 511.94, "Price rises, pulls back, taps the same area again,"], [511.99, 515.02, "and then makes a much bigger move upward."], [515.07, 520.62, "That's how I use strength and structure to filter support zones."], [520.67, 524.07, "Of course, we're looking at a higher timeframe here."], [524.12, 526.44, "Later, we'll bring the same logic down to"], [526.49, 530.15, "a smaller timeframe and go into more detail."], [530.2, 532.4, "That was our support example."], [532.45, 535.42, "Now let's look at resistance."], [535.47, 536.94, "Look at this chart."], [536.99, 540.74, "If you're a complete beginner, it might seem confusing."], [540.79, 545.05, "You can see several possible levels: a former resistance that turned"], [545.1, 550.43, "into support, another reaction zone here, and another one over there."], [550.48, 554.74, "You might be thinking, “Which level am I supposed to mark?”"], [554.79, 556.44, "Let me simplify it."], [556.49, 558.57, "Forget the noise for a moment and ask"], [558.62, 562.73, "one question: Where did the big move start?"], [562.78, 565.84, "Where did the strongest downward momentum begin?"], [565.88, 569.82, "Take a moment and look at the chart."], [569.87, 573.19, "If you chose this particular level, you're correct."], [573.24, 576.19, "Price was moving downward, but the strongest"], [576.24, 579.14, "bearish move began from this area."], [579.19, 581.78, "If I want to mark just one important resistance"], [581.83, 585.09, "level, this is the one I would prioritize."], [585.14, 587.52, "Price has reacted here multiple times."], [587.57, 590.81, "A strong downward move started here."], [590.86, 593.28, "And that move also broke structure to the"], [593.33, 596.69, "downside by taking out a previous significant low."], [596.74, 599.8, "That's the combination we're looking for."], [599.85, 602.03, "Now, someone might say, “Dr."], [602.08, 604.91, "Aaron, what about this other level?"], [604.96, 610.42, "It was support, became resistance, and price moved down from it too.”"], [610.47, 611.69, "That's a fair question."], [611.74, 613.86, "But look carefully."], [613.91, 616.98, "Price tried to react at that lower level, moved"], [617.03, 620.71, "down, failed to continue, and came back up."], [620.76, 624.08, "It's now approaching the higher resistance area."], [624.13, 628.36, "Does that mean price absolutely cannot fall from the lower level?"], [628.4, 629.21, "No."], [629.26, 631.86, "But the move toward that level was strong,"], [631.91, 634.26, "and it didn't hold the way we wanted."], [634.31, 636.12, "I would give more weight to the resistance"], [636.16, 639.72, "zone from which the major bearish move began."], [639.77, 641.81, "Watch how price develops."], [641.86, 644.07, "It breaks through the lower level."], [644.12, 647.21, "Now the next important level left on our chart is"], [647.26, 651.91, "the main resistance zone where the stronger downward move began."], [651.96, 656.04, "Remember this: when you're confused by several zones, give"], [656.09, 659.32, "priority to the one that produced a significant move."], [659.38, 664.09, "If an area didn't create much momentum, don't automatically treat it as"], [664.14, 668.6, "the most important level unless current price action gives you a reason."], [668.66, 674.33, "Suppose price now reaches our marked resistance and prints a bearish candle."], [674.38, 677.98, "That could be an opportunity to consider a short trade."], [678.03, 680.72, "Let's place the stop loss above the candle"], [680.77, 684.05, "or above the zone, depending on our plan."], [684.1, 687.78, "We could target a risk-to-reward ratio of one to two."], [687.82, 691.56, "Even a smaller move can offer an opportunity."], [691.61, 693.84, "On gold, for example, a move of"], [693.89, 696.74, "around 50 dollars can be substantial."], [696.79, 701.15, "The key is identifying the zone and planning the trade."], [701.2, 704.83, "Now, let's follow the example on the chart."], [704.88, 707.86, "Price has moved upward and tapped our resistance."], [707.9, 710.55, "A red candle appears."], [710.6, 714.25, "Let's say I enter a short, place the stop loss above the"], [714.3, 718.82, "area, and set the target near the round number of 4,000."], [718.87, 725.22, "In this illustration, the risk-to-reward ratio is roughly one to 3.9."], [725.27, 726.8, "Let's see what happens."], [726.85, 729.08, "Price moves down, gets close to the"], [729.13, 732.84, "target, pulls up briefly, then falls again."], [732.89, 734.15, "And there we go."], [734.2, 736.47, "Our target is hit."], [736.52, 741.81, "We used a simple principle: identify the important zone, look for strength"], [741.86, 747.38, "and structure, wait for price to return, and then evaluate a trade."], [747.43, 750.78, "You can also apply this idea to swing trading."], [750.83, 755.31, "If you're working, studying, or can't watch charts all day, you may"], [755.36, 759.78, "prefer higher-timeframe setups that can last for two or three days."], [759.83, 763.76, "Mark the important zones, place alerts, and"], [763.81, 766.24, "wait for price to reach those areas."], [766.29, 770.24, "Then assess your entry, stop loss, and target."], [770.29, 773.14, "We're using a one-hour chart in this example, and"], [773.19, 775.9, "this kind of planning can also be useful for"], [775.95, 779.29, "traders who cannot monitor every small movement."], [779.34, 783.5, "Now let's move on to more advanced examples: support"], [783.55, 788.33, "turning into resistance, and resistance turning into support."], [788.38, 791.86, "First, let's look at support turning into resistance."], [791.91, 795.34, "Here's a strong support level."], [795.39, 799.06, "You can see that a major bullish move started here."], [799.11, 803.8, "Later, price returned to the same area, bounced again, and created"], [803.85, 807.84, "a bullish break of structure by reaching a higher level."], [807.89, 810.58, "But eventually, the support broke."], [810.63, 813.95, "Now, what should we look for?"], [814.0, 817.72, "Earlier, when evaluating support, we checked whether price"], [817.77, 820.74, "had moved upward strongly from the level."], [820.79, 823.46, "When evaluating resistance, we checked whether a"], [823.51, 826.73, "strong sell-side move had started there."], [826.78, 830.52, "When support breaks and may become resistance, we want to"], [830.57, 834.02, "see how strong the selling was during the breakdown."], [834.07, 836.55, "Did sellers take control aggressively?"], [836.6, 840.12, "Did price break an important low?"], [840.17, 844.3, "The stronger the breakdown and the more meaningful the break of structure,"], [844.35, 848.75, "the more interested I become in a possible retest of that level."], [848.8, 850.33, "Here's our example."], [850.38, 852.31, "Support breaks."], [852.36, 856.03, "Price moves sharply downward with strong selling pressure."], [856.08, 858.76, "Then price comes back up to test the"], [858.81, 861.99, "old support, which may now act as resistance."], [862.04, 865.69, "A bearish candle appears near that level."], [865.74, 868.88, "I can consider a short entry with a stop loss above"], [868.93, 874.87, "the resistance zone and a target near 4,200, a round-number level."], [874.92, 877.53, "Let's see how the chart develops."], [877.58, 879.43, "Price moves down."], [879.48, 884.97, "Later, it comes back up and tests that same resistance area again."], [885.02, 887.73, "Why am I watching this level closely?"], [887.78, 891.45, "Because the initial breakdown had strong selling momentum,"], [891.5, 895.49, "and price also broke structure to the downside."], [895.54, 898.64, "Now we wait for a bearish candle to appear."], [898.69, 900.23, "There it is."], [900.28, 903.4, "Let's say I take the short entry, place the stop"], [903.45, 908.93, "loss above that candle, and set a target around 4,200."], [908.98, 912.15, "In this example, price hits our stop loss."], [912.2, 914.36, "We lose the trade."], [914.41, 917.8, "But notice that price eventually moves down afterward."], [917.84, 920.37, "This shows why stop-loss placement matters."], [920.42, 924.26, "A stop just above an individual candle may"], [924.31, 926.27, "be too tight for the structure we're trading."], [926.32, 929.33, "A wider stop above the full invalidation zone would have changed the"], [929.38, 936.42, "result, although it would also have changed the risk and position size."], [936.47, 940.45, "The main point here isn't the specific stop loss or target."], [940.5, 944.69, "It's learning how to recognize and mark the important zone."], [944.74, 947.6, "I hope that example makes sense."], [947.65, 952.86, "Now let's look at the opposite: resistance turning into support."], [952.91, 956.02, "Here we have another useful example."], [956.07, 958.43, "First, notice this support level."], [958.48, 962.08, "Price has found support here several times, and"], [962.13, 965.39, "a strong move began from this area."], [965.44, 968.6, "But there's also a resistance level above it."], [968.65, 974.39, "Price has tested that resistance before, and now it finally breaks through."], [974.44, 979.42, "Once resistance is broken, it may start acting as support."], [979.47, 981.26, "What do we need to check?"], [981.31, 983.59, "The same two questions."], [983.64, 988.91, "First, did price break the resistance with strong bullish momentum?"], [988.96, 990.67, "Yes."], [990.72, 993.62, "Second, did the move create a bullish break of"], [993.67, 997.93, "structure by taking out a previous significant high?"], [997.98, 1000.35, "Yes, it did."], [1000.4, 1002.96, "So we have two reasons to pay attention to this"], [1003.01, 1007.08, "level when price comes back down to retest it."], [1007.13, 1012.07, "If price touches the former resistance, now potential support, and prints a"], [1012.12, 1016.86, "bullish candle, that may give us an opportunity to consider a buy."], [1016.91, 1018.64, "Let's watch what happens."], [1018.68, 1023.04, "Price comes back and just touches the area."], [1023.09, 1026.79, "Suppose we wait for that bullish candle, enter a buy,"], [1026.84, 1030.23, "and place the stop loss below the support zone."], [1030.28, 1033.34, "We also set our target above the entry."], [1033.39, 1035.28, "And here you can see that price"], [1035.33, 1038.14, "makes a very, very strong move."], [1038.19, 1040.88, "Now you know the two key questions I"], [1040.93, 1044.29, "ask when marking support and resistance zones."], [1044.34, 1048.35, "First, did price move away from that level with strength?"], [1048.4, 1052.04, "Second, did that move break market structure?"], [1052.09, 1054.39, "Use those two questions as part of your"], [1054.44, 1058.91, "chart analysis, and always manage your risk."], [1058.96, 1062.53, "If this lesson helped you, subscribe to GoPipways,"], [1062.58, 1066.88, "and start your trading journey at Gopipways."], [1066.92, 1067.64, "GoPipways."], [1067.69, 1070.71, "Trade with a plan, not a guess."]];const CHARTS={"A": {"symbol": "GOLD / 1H / ILLUSTRATION", "candles": [[4380, 4385.84, 4375.82, 4384.26], [4384.26, 4405.7, 4383.98, 4400.12], [4400.12, 4422.28, 4395.01, 4417.67], [4417.67, 4421.61, 4415.68, 4418.64], [4418.64, 4451.33, 4418.22, 4447.2], [4447.2, 4458.75, 4445.99, 4447.95], [4447.95, 4461.27, 4447.55, 4456.49], [4456.49, 4475.12, 4456.23, 4473.67], [4473.67, 4488.95, 4469.07, 4486.04], [4486.04, 4500, 4478.52, 4496], [4496, 4501.96, 4488.49, 4489.21], [4489.21, 4489.22, 4461.89,
