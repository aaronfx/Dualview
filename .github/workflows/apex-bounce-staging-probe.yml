name: APEX Rescue collision staging probe

on:
  push:
    branches: [gpt-apex-prop-character-collisions]
    paths:
      - '.github/workflows/apex-bounce-staging-probe.yml'
      - 'apex-animation-engine/scripts/probe_rescue_staging.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apex-animation-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apex-animation-engine/pyproject.toml
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Evaluate collision-safe character staging variants
        run: python -u scripts/probe_rescue_staging.py
