name: APEX Director boundary regression
on:
  pull_request:
    paths:
      - 'apex-animation-engine/**'
      - '.github/workflows/apex-director-boundary.yml'
  workflow_dispatch:

jobs:
  offline-director:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apex-animation-engine
    env:
      APEX_AI_PAID_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q tests/test_plan_compiler.py tests/test_plan_revision.py tests/test_story_check.py
