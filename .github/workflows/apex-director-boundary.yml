name: APEX Director boundary regression
on:
  pull_request:
    paths:
      - 'apex-animation-engine/**'
      - '.github/workflows/apex-director-boundary.yml'
  workflow_dispatch:

jobs:
  offline-director:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apex-animation-engine
    env:
      APEX_AI_PAID_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg libegl1 libgl1 libglx0
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q tests/test_plan_compiler.py tests/test_plan_revision.py tests/test_story_check.py
      - run: python -m pytest -q tests/test_smart_director.py -k catalogue
      - run: python -m pytest -q tests/test_story_native_plans.py tests/test_causal_evidence.py tests/test_reaction_proof.py
      - run: python -m pytest -q tests/test_presentation_audit.py tests/test_core_run_preservation.py tests/test_objective_planner.py tests/test_body_physics.py
      - run: python -m pytest -q tests/test_character_brain.py tests/test_obstacle_assessment.py -k 'not multichar_course'
