name: APEX Director's Cut engine tests

on:
  push:
    branches:
      - gpt-core-run-directors-cut-engine
  pull_request:
    branches:
      - ccr-8f5558fb-f9agl2
    paths:
      - "apex-animation-engine/**"
      - ".github/workflows/apex-directors-cut-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

# Push and PR updates on the same branch share one CI lane; obsolete runs cancel.
concurrency:
  group: apex-directors-cut-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  animation-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apex-animation-engine
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install system libraries needed by Skia
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libegl1 libgl1 libopengl0
      - name: Install APEX dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run Director's Cut feature tests
        run: PYTHONPATH=src python -m pytest -q tests/test_directors_cut_engine.py
      - name: Run full APEX regression suite
        run: PYTHONPATH=src python -m pytest -q
