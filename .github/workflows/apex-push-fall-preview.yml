name: APEX push and fall performance preview

on:
  push:
    branches:
      - gpt-apex-push-fall-performance
    paths:
      - '.github/workflows/apex-push-fall-preview.yml'
      - 'apex-animation-engine/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: apex-animation-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: apex-animation-engine/pyproject.toml
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libegl1
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Regression tests
        run: pytest -q tests/test_push_fall_performance.py tests/test_rescue.py
      - name: Use synthesized audio when optional recordings are not in Git
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('src/apex/audio/sfx/manifest.json')
          m = json.loads(p.read_text(encoding='utf-8'))
          missing = [f for spec in m.get('sounds', {}).values() for layer in spec.get('layers', []) for f in layer.get('files', []) if not (p.parent / f).exists()]
          if missing:
              print(f'Using original synth fallback; {len(missing)} optional sound files absent')
              m['sounds'] = {}
              m.pop('room_tone', None)
              p.write_text(json.dumps(m), encoding='utf-8')
          PY
      - name: Render full Rescue and capture QA
        run: |
          mkdir -p out
          apex render examples/the_rescue.json -o out/APEX_Rescue_PushFall_Improved_720p.mp4 --scale 0.667 --samples 1 --qa-json out/push_fall_qa.json --review-dir out/review
      - name: Export the changed action (1.8 to 5.5 s)
        run: |
          ffmpeg -hide_banner -loglevel error -y -ss 1.8 -i out/APEX_Rescue_PushFall_Improved_720p.mp4 -t 3.7 -c:v libx264 -preset fast -crf 20 -c:a aac -b:a 128k out/APEX_PushFall_Improved_Clip.mp4
      - name: Upload videos and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apex-push-fall-render
          path: |
            apex-animation-engine/out/APEX_Rescue_PushFall_Improved_720p.mp4
            apex-animation-engine/out/APEX_PushFall_Improved_Clip.mp4
            apex-animation-engine/out/push_fall_qa.json
            apex-animation-engine/out/review/
          if-no-files-found: warn
          retention-days: 7
