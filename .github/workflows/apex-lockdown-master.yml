name: APEX LOCKDOWN 180-second master rehearsal
on:
  pull_request:
    branches: [apex-unified]
    paths:
      - 'apex-animation-engine/**'
      - '.github/workflows/apex-lockdown-master.yml'
  workflow_dispatch:
jobs:
  master:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    defaults:
      run:
        working-directory: apex-animation-engine
    env:
      APEX_AI_PAID_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg libegl1 libgl1 libglx0
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q tests/test_lockdown_master.py tests/test_live_conflict.py
      - name: Rehearse continuous seven-act timeline
        run: python examples/build_lockdown_master.py out/lockdown_master/film.json
      - name: Render full three-minute rehearsal, retain QA failure
        if: always() && !cancelled()
        run: |
          test -f out/lockdown_master/film.json
          rc=0
          apex render out/lockdown_master/film.json -o out/lockdown_master/LOCKDOWN_180s_REHEARSAL.mp4 --scale 0.5 --samples 1 --qa-json out/lockdown_master/qa.json || rc=$?
          ffmpeg -v error -xerror -i out/lockdown_master/LOCKDOWN_180s_REHEARSAL.mp4 -f null -
          python -c 'import subprocess; d=float(subprocess.check_output(["ffprobe","-v","error","-show_entries","format=duration","-of","default=nw=1:nk=1","out/lockdown_master/LOCKDOWN_180s_REHEARSAL.mp4"])); print("Rendered duration:",d); assert abs(d-180)<0.15'
          exit "$rc"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apex-lockdown-master
          path: apex-animation-engine/out/lockdown_master/
          if-no-files-found: warn
