name: APEX LOCKDOWN 160-second master rehearsal
on:
  pull_request:
    branches: [apex-unified]
    paths:
      - 'apex-animation-engine/**'
      - '.github/workflows/apex-lockdown-master.yml'
  workflow_dispatch:
jobs:
  master:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    defaults:
      run:
        working-directory: apex-animation-engine
    env:
      APEX_AI_PAID_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg libegl1 libgl1 libglx0
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q tests/test_lockdown_master.py tests/test_live_conflict.py
      - name: Rehearse continuous seven-act timeline
        run: python examples/build_lockdown_master.py out/lockdown_master/film.json
      - name: Render only after native narrative and pacing acceptance
        run: |
          apex validate out/lockdown_master/film.json
          apex render out/lockdown_master/film.json -o out/lockdown_master/film.mp4 --scale 1 --samples 1 --qa-json out/lockdown_master/qa.json
          ffmpeg -v error -xerror -i out/lockdown_master/film.mp4 -f null -
      - name: Render opening act as explicitly unaccepted rehearsal preview
        if: always() && !cancelled()
        run: |
          test -f out/lockdown_master/opening_preview.json
          apex render out/lockdown_master/opening_preview.json -o out/lockdown_master/opening_preview.mp4 --scale 0.5 --samples 1 --qa-json out/lockdown_master/opening_qa.json
          ffmpeg -v error -xerror -i out/lockdown_master/opening_preview.mp4 -f null -
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apex-lockdown-master
          path: apex-animation-engine/out/lockdown_master/
          if-no-files-found: warn
