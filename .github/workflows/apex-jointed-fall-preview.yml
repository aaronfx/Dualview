name: APEX experimental articulated fall test and render

on:
  push:
    branches: [gpt-apex-articulated-ragdoll]
    paths:
      - '.github/workflows/apex-jointed-fall-preview.yml'
      - 'apex-animation-engine/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ragdoll-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: apex-animation-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: apex-animation-engine/pyproject.toml
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libegl1
          python -m pip install -e '.[dev]'
      - name: Regression and articulated-body tests
        run: pytest -q tests/test_rescue.py tests/test_push_fall_performance.py tests/test_active_fall.py tests/test_jointed_fall.py
      - name: Fallback to built-in synth if recorded audio assets are absent
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          p = Path('src/apex/audio/sfx/manifest.json')
          m = json.loads(p.read_text(encoding='utf-8'))
          missing = [f for s in m.get('sounds', {}).values() for layer in s.get('layers', []) for f in layer.get('files', []) if not (p.parent / f).exists()]
          if missing:
              m['sounds'] = {}
              m.pop('room_tone', None)
              p.write_text(json.dumps(m), encoding='utf-8')
              print('Optional recordings absent; using built-in synthesizer')
          PY
      - name: Render articulated-fall preview
        env:
          APEX_EXPERIMENTAL_ACTIVE_FALL: '1'
          APEX_EXPERIMENTAL_JOINTED_FALL: '1'
        run: |
          mkdir -p out
          apex render examples/the_rescue.json -o out/APEX_Rescue_JointedFall_720p.mp4 --scale 0.667 --samples 1 --qa-json out/jointed_fall_qa.json --review-dir out/review
      - name: Extract falling sequence
        if: success()
        run: |
          ffmpeg -y -hide_banner -loglevel error -ss 1.8 -i out/APEX_Rescue_JointedFall_720p.mp4 -t 4.1 -c:v libx264 -preset fast -crf 22 -c:a aac out/APEX_JointedFall_Closeup.mp4
      - name: Upload test output and preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apex-jointed-fall-preview
          retention-days: 7
          if-no-files-found: warn
          path: |
            apex-animation-engine/out/APEX_Rescue_JointedFall_720p.mp4
            apex-animation-engine/out/APEX_JointedFall_Closeup.mp4
            apex-animation-engine/out/jointed_fall_qa.json
            apex-animation-engine/out/review/
