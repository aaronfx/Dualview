name: APEX gesture preview

on:
  push:
    branches:
      - gpt-apex-performance-gesture
    paths:
      - '.github/workflows/apex-gesture-preview.yml'
      - 'apex-animation-engine/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-gesture-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apex-animation-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: apex-animation-engine/pyproject.toml
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libegl1
      - name: Install APEX
        run: python -m pip install -e '.[dev]'
      - name: Run gesture and rescue regression tests
        run: pytest -q tests/test_gesture_performance.py tests/test_rescue.py
      - name: Render 720p Rescue preview from APEX
        run: |
          mkdir -p out
          apex render examples/the_rescue.json -o out/rescue_gesture_preview.mp4 --scale 0.667 --samples 1 --review-dir out/gesture_review
      - name: Export ending highlight (16–20 seconds)
        run: |
          ffmpeg -hide_banner -loglevel error -y -ss 16 -i out/rescue_gesture_preview.mp4 -t 4 -c:v libx264 -preset veryfast -crf 22 -c:a aac -b:a 128k out/rescue_gesture_ending.mp4
      - name: Upload rendered video and review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apex-gesture-render
          path: |
            apex-animation-engine/out/rescue_gesture_preview.mp4
            apex-animation-engine/out/rescue_gesture_ending.mp4
            apex-animation-engine/out/gesture_review/
          if-no-files-found: warn
          retention-days: 7
