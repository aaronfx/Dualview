name: APEX Smart Director local foundation
on:
  pull_request:
    paths:
      - 'apex-animation-engine/**'
      - '.github/workflows/apex-smart-director.yml'
  workflow_dispatch:
jobs:
  director:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apex-animation-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q tests/test_smart_director.py tests/test_autochoreo.py tests/test_apex_extension_native.py
      - run: python examples/smart_director_crossing.py --out out/smart_director --render
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apex-smart-director-native-proof
          path: apex-animation-engine/out/smart_director/
