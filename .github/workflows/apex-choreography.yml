name: APEX M3 choreography verification

on:
  push:
    branches: [feature/apex-three-reference-grade]
    paths:
      - '.github/workflows/apex-choreography.yml'
      - 'apex-animation-engine/src/apex/scene/choreography.py'
      - 'apex-animation-engine/tests/test_choreography.py'
  workflow_dispatch:

jobs:
  plan-simulate-retry:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install APEX test runtime
        run: python -m pip install --disable-pip-version-check -e './apex-animation-engine[dev]'
      - name: Verify candidate planning and authoritative physics replay
        working-directory: apex-animation-engine
        run: python -m pytest -q tests/test_choreography.py tests/test_route_planner.py
