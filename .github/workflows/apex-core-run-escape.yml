name: APEX CORE RUN The Escape - three minute integration film
on:
  pull_request:
    branches: [apex-unified]
    paths:
      - 'apex-animation-engine/examples/build_core_run_escape.py'
      - '.github/workflows/apex-core-run-escape.yml'
  workflow_dispatch:
jobs:
  scene:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        scene: [city, tower, canyon, arena, escape, summit]
    defaults:
      run:
        working-directory: apex-animation-engine
    env:
      APEX_AI_PAID_ENABLED: '0'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg libegl1 libgl1 libglx0
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q tests/test_core_run_escape.py
      - run: python examples/build_core_run_escape.py part out/core_run_escape_parts ${{ matrix.scene }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-run-escape-part-${{ matrix.scene }}
          path: |
            apex-animation-engine/out/core_run_escape_parts/*.mp4
            apex-animation-engine/out/core_run_escape_parts/*.json
          if-no-files-found: warn
  film:
    needs: scene
    if: always() && !cancelled()
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apex-animation-engine
    env:
      APEX_AI_PAID_ENABLED: '0'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg libegl1 libgl1 libglx0
      - run: python -m pip install -e '.[dev]'
      - uses: actions/download-artifact@v4
        with:
          pattern: core-run-escape-part-*
          path: apex-animation-engine/out/core_run_escape_parts
          merge-multiple: true
      - run: python examples/build_core_run_escape.py assemble out/core_run_escape_parts out/core_run_escape
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-run-escape-3min
          path: apex-animation-engine/out/core_run_escape/
          if-no-files-found: warn
