name: APEX reference-triad creative QA

on:
  push:
    branches:
      - feature/apex-three-reference-grade
    paths:
      - 'apex-animation-engine/src/apex/scene/creative.py'
      - 'apex-animation-engine/src/apex/scene/math_semantics.py'
      - 'apex-animation-engine/src/apex/qa/creative.py'
      - 'apex-animation-engine/src/apex/qa/film.py'
      - 'apex-animation-engine/src/apex/scene/schema.py'
      - 'apex-animation-engine/tests/test_creative_storyboard.py'
      - 'apex-animation-engine/tests/test_math_semantics.py'
      - '.github/workflows/apex-reference-triad-tests.yml'
  pull_request:
    paths:
      - 'apex-animation-engine/**'
      - '.github/workflows/apex-reference-triad-tests.yml'
  workflow_dispatch:

jobs:
  creative-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check 'pydantic>=2.6,<3' 'sympy>=1.13,<2' 'pytest>=8,<10'
      - name: Test mathematics and three reference-story contracts
        env:
          PYTHONPATH: apex-animation-engine/src
        run: python -m pytest -q apex-animation-engine/tests/test_math_semantics.py apex-animation-engine/tests/test_creative_storyboard.py
